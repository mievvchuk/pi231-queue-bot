name: Tests

on:
  pull_request:
  push:
    branches: [master, develop, 'feature/**', 'bugfix/**', 'release/**', 'hotfix/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queue_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue_test -d queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ''
      TEST_DATABASE_URL: postgresql://queue_test:local_ci_only@localhost:5432/queue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --tb=short
      - run: python -m compileall -q bot.py queue_bot
